name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with: node-version: 18
      - name: Install backend deps
        run: |
          cd backend
          npm ci
      - name: Run backend lint/test
        run: |
          cd backend
          npm test
      - name: Python setup for ML
        uses: actions/setup-python@v4
        with:
          python-version: 3.10
      - name: Install python deps
        run: |
          cd ml
          pip install -r requirements.txt
      - name: Smoke run model server
        run: |
          python -c "print('smoke test')"
